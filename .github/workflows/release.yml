name: Release

# Dispara a cada push na main: calcula a próxima versão semântica, versiona
# o package.json e cria a tag + Release no GitHub.
#
# Este workflow NÃO faz mais deploy em homologação. Homologação é
# alimentada exclusivamente pela branch `staging` (ver deploy-staging.yml),
# e produção continua sendo um deploy manual de uma tag criada aqui (ver
# deploy-production.yml).
#
# Fluxo esperado:
#   1. Criar a branch de trabalho a partir da main.
#   2. Abrir PR -> staging e PR -> main.
#   3. Merge na staging => deploy automático em homologação.
#   4. Homologado, merge na main => nova tag/Release.
#   5. Rodar "Deploy Production" escolhendo a tag.

on:
  push:
    branches:
      - main

concurrency:
  group: tmf-frontend-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.next }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main

      - name: Update package.json version
        run: |
          jq '.version = "${{ steps.semver.outputs.next }}"' package.json > temp.json && mv temp.json package.json

      - name: Push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: ${{ steps.semver.outputs.next }}"
          git tag ${{ steps.semver.outputs.next }}
          git push origin main --tags

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          tag: ${{ steps.semver.outputs.next }}
          allowUpdates: true
          draft: false
          makeLatest: true
          generateReleaseNotes: true
          name: ${{ steps.semver.outputs.next }}
          body: Changelog Contents
          token: ${{ github.token }}
