name: Deploy Homolog (staging)

# Dispara a cada push na branch `staging` (ou manualmente): builda a imagem
# Docker (usando o Dockerfile do repo, com a API_URL de homologação do
# environment `homolog`) e publica no GitHub Container Registry (GHCR) com
# duas tags:
#   - ghcr.io/<org>/tmf-frontend:homolog          -> sempre aponta pro último deploy da staging
#   - ghcr.io/<org>/tmf-frontend:staging-<sha>    -> imutável, útil pra rastrear/rollback
# e dispara o Deploy Webhook do Coolify pra puxar a nova imagem `:homolog`.
#
# Não gera versão, tag git nem Release — isso só acontece no merge na main
# (ver release.yml). Assim homologação fica totalmente desacoplada de
# produção.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: tmf-frontend-homolog
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: homolog
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=${{ secrets.API_URL }}
            API_URL_V2=${{ secrets.API_URL_V2 }}
            CLIENT_CONFIG_DEFAULT=${{ secrets.CLIENT_CONFIG_DEFAULT }}
          tags: |
            ghcr.io/${{ github.repository }}:homolog
            ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          curl -fsSL -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
